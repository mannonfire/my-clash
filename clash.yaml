mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
  fallback:
    - 8.8.4.4
    - 1.0.0.1

proxy-providers:
  Romania:
    type: http
    url: "https://cdn.jsdelivr.net/gh/Au1rxx/free-vpn-subscriptions@main/output/clash-RO.yaml"
    interval: 3600
    path: ./romania.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: Romania
    type: select
    use:
      - Romania
    proxies:
      - DIRECT

  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - Romania

  - name: PROXY
    type: select
    proxies:
      - Auto
      - Romania
      - DIRECT

rules:
  - GEOIP,IR,DIRECT
  - MATCH,PROXY
