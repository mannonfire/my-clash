port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info

dns:
  enable: true
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

proxy-providers:
  Romania:
    type: http
    url: "https://cdn.jsdelivr.net/gh/Au1rxx/free-vpn-subscriptions@main/output/clash-RO.yaml"
    interval: 3600
    path: ./romania.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: select
    use:
      - Romania
    proxies:
      - DIRECT

rules:
  - GEOIP,IR,DIRECT
  - MATCH,PROXY
