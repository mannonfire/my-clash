mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
    - tls://dns.google
  fallback:
    - https://1.0.0.1/dns-query
    - https://dns.google/dns-query
    - tls://8.8.4.4
  fallback-filter:
    geoip: true
    geoip-code: IR
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

proxy-providers:
  Romania:
    type: http
    url: "https://cdn.jsdelivr.net/gh/Au1rxx/free-vpn-subscriptions@main/output/clash-RO.yaml"
    interval: 3600
    path: ./providers/romania.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000

proxy-groups:
  - name: 🇷🇴 Romania
    type: select
    use:
      - Romania
    proxies:
      - REJECT
      - DIRECT

  - name: Auto Romania
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    use:
      - Romania

  - name: PROXY
    type: select
    proxies:
      - Auto Romania
      - 🇷🇴 Romania
      - DIRECT

  - name: FINAL
    type: select
    proxies:
      - PROXY
      - DIRECT
      - REJECT

rules:
  - GEOIP,IR,DIRECT,no-resolve
  - MATCH,FINAL
